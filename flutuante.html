<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>IdleDroid - flutuante</title>
  <!-- Tela do modo flutuante (sobre outros apps). Fundo transparente: só a luta aparece.
       No app ela roda numa janela própria (FlutuanteService.java) e lê o save pela "Ponte". -->
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    #stage { width: 100vw; height: 100vh; display: block; object-fit: contain;
             image-rendering: pixelated; image-rendering: crisp-edges; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <script src="src/sim.js?v=1"></script>
  <script src="src/player.js?v=3"></script>
  <script src="src/flutuante.js?v=1"></script>
</body>
